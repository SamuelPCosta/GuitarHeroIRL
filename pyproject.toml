[project]
name = "ghirl"
version = "0.2.0"
description = "Guitar Hero IRL: notas sobre o braço do violão em tempo real, por visão computacional"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_ghirl.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
